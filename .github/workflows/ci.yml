name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Deterministic toolchain (M1 baseline).
  NODE_VERSION: '22.23.4'
  PNPM_VERSION: '11.28.5'
  # Unsigned build on CI: winCodeSign cannot create symlinks on the runner, same as dev.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  quality:
    name: Quality gate (typecheck / unit / license)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      # PRD §12/§14: UNLICENSED or unreviewed dependencies must not enter a release build.
      - name: License gate
        run: pnpm run license:check

      # D05 / SEC-LIC: the shipped third-party notices must match the real dependency closure.
      - name: Third-party notices check
        run: pnpm run notices:check

      # SEC-LIC: license *full texts* shipped with the installer must match the closure, and the
      # files referenced by resource manifests (node.json -> licenses/node-LICENSE.txt) must exist.
      - name: License texts check
        run: pnpm run licenses:check

      # D01: the built-in plugin index must pass the official format-1 validator and our own
      # assertions (registry publishTimestamp / integrity included), and must not be stale.
      - name: Build market index
        run: pnpm run build:index

      - name: Validate market index artifacts
        run: pnpm run validate:index

  package:
    name: Build installer (unsigned)
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS installer
        run: pnpm run dist

      # Guards the M2.1 fix (D7): the packaged exe must carry package.json's version, not Electron's.
      - name: Assert executable version resource
        shell: pwsh
        run: |
          $expected = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $info = (Get-Item 'release/win-unpacked/DeepSeek Deploy Assistant.exe').VersionInfo
          if ($info.FileVersion -ne $expected) { throw "FileVersion '$($info.FileVersion)' != '$expected'" }
          if (-not $info.ProductVersion.StartsWith($expected)) { throw "ProductVersion '$($info.ProductVersion)' != '$expected'" }
          Write-Host "OK: FileVersion=$($info.FileVersion) ProductVersion=$($info.ProductVersion)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-deploy-assistant-nsis
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
