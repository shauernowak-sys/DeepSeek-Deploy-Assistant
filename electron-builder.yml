appId: com.dda.harness-deploy-assistant
productName: DeepSeek Deploy Assistant
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

extraResources:
  - from: apps/desktop/resources
    to: .
  # D05 / SEC-LIC：第三方许可清单随安装包分发
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  # SEC-LIC：许可全文（licenses/README.md 是索引；node.json 的 license.textFile 按此相对路径解析）
  - from: licenses
    to: licenses

asar: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: deepseek-deploy-assistant-${version}-${arch}.${ext}
  # Never ask for elevation: per-user install, matches ADR-006.
  requestedExecutionLevel: asInvoker
  # M2.1: electron-builder's own resource editing (+ signing) is skipped because on a non-admin
  # machine it downloads the winCodeSign toolchain, which cannot extract its symlinks. Version
  # resources are therefore written by scripts/set-win-version.mjs (resedit) between the `--dir`
  # and the NSIS pass — see package.json "dist".
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeepSeek Deploy Assistant
  uninstallDisplayName: DeepSeek Deploy Assistant
  deleteAppDataOnUninstall: false
  # Removes the empty install directory the uninstaller leaves behind (K-M2-11).
  include: build/installer.nsh

publish: null
